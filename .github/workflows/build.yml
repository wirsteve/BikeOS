name: Build BikeOS

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core logic)
        run: ./gradlew --no-daemon :core:test

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/BikeOS-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/BikeOS-debug.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: BikeOS-apk
          path: dist/*.apk

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

  device-tests:
    # Runs BikeOS on real Android emulators matching the Peloton tablets:
    # API 25 = Android 7.1 (Peloton Bike), API 29 = Android 10 (Peloton Bike+).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [25, 29]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Generate an original test ride clip
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          ffmpeg -loglevel error -y -f lavfi -i "gradients=s=1280x720:c0=0x0b1f3a:c1=0x1d6fa5:c2=0x3ddc97:c3=0xff7a3a:speed=0.02:d=40" \
            -c:v libx264 -pix_fmt yuv420p bikeos_test_ride.mp4 \
            || ffmpeg -loglevel error -y -f lavfi -i "testsrc2=s=1280x720:d=40" -c:v libx264 -pix_fmt yuv420p bikeos_test_ride.mp4
          ls -la bikeos_test_ride.mp4

      - name: Run on-device tests (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          # Tablet-sized landscape screen, closer to the Peloton's 1080p display than a phone.
          profile: pixel_c
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Each line runs separately. The connected task uninstalls the app (and its screenshots) when it
          # finishes, so screenshots come from a second run that leaves the app installed.
          script: |
            adb push bikeos_test_ride.mp4 /sdcard/Movies/bikeos_test_ride.mp4
            ./gradlew --no-daemon :app:connectedDebugAndroidTest || (adb logcat -d -t 3000 | grep -iE "BikeOS|AndroidRuntime|FATAL" | tail -200; exit 1)
            ./gradlew --no-daemon :app:installDebug :app:installDebugAndroidTest
            adb shell appops set com.bikeos SYSTEM_ALERT_WINDOW allow
            adb shell am instrument -w -e class com.bikeos.AppFlowTest com.bikeos.test/androidx.test.runner.AndroidJUnitRunner || true
            adb pull /sdcard/Android/data/com.bikeos/files/screenshots screenshots-api${{ matrix.api }} || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report-api${{ matrix.api }}
          path: app/build/reports/androidTests/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-api${{ matrix.api }}
          path: screenshots-api${{ matrix.api }}/
          if-no-files-found: ignore

  publish-screenshots:
    # Commits the emulator screenshots to docs/screenshots on the pushed branch so they can be
    # viewed on GitHub (and in the README). GITHUB_TOKEN pushes don't trigger another CI run.
    needs: device-tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: screenshots-api29
          path: shots
        continue-on-error: true
      - name: Commit screenshots
        run: |
          [ -d shots ] && ls shots/*.png >/dev/null 2>&1 || { echo "no screenshots"; exit 0; }
          mkdir -p docs/screenshots
          for f in shots/*.png; do
            n=$(basename "$f" | sed 's/^api29_//')
            if command -v convert >/dev/null; then convert "$f" -resize '1600x1600>' "docs/screenshots/$n"; else cp "$f" "docs/screenshots/$n"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -m "Update emulator screenshots [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
