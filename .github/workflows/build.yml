name: Build BikeOS

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core logic)
        run: ./gradlew --no-daemon :core:test

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/BikeOS-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/BikeOS-debug.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: BikeOS-apk
          path: dist/*.apk

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/

  device-tests:
    # Runs BikeOS on real Android emulators matching the Peloton tablets:
    # API 25 = Android 7.1 (Peloton Bike), API 29 = Android 10 (Peloton Bike+).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [25, 29]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Run on-device tests (API ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest || (adb logcat -d -t 3000 | grep -iE "BikeOS|AndroidRuntime|FATAL" | tail -200; exit 1)
            adb pull /sdcard/Android/data/com.bikeos/files/screenshots screenshots-api${{ matrix.api }} || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report-api${{ matrix.api }}
          path: app/build/reports/androidTests/

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-api${{ matrix.api }}
          path: screenshots-api${{ matrix.api }}/
          if-no-files-found: ignore
