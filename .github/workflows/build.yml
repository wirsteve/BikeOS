name: Build BikeOS

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (core logic)
        run: ./gradlew --no-daemon :core:test

      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/BikeOS-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/BikeOS-debug.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: BikeOS-apk
          path: dist/*.apk

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/
